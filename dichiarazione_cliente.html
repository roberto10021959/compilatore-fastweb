<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dichiarazione Conferma MNP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6f9; }
    .card { max-width: 580px; margin: 40px auto; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.1); }
    .card-header { background: #e60000; color: white; border-radius: 12px 12px 0 0; font-weight: 600; font-size: 1.1rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header text-center py-3">Dichiarazione Conferma MNP</div>
    <div class="card-body p-4">

      <h5 class="mb-1">{{ cliente.get("RAGIONE SOCIALE", "") }}</h5>
      <p class="text-muted mb-1">P.IVA: {{ piva }}</p>
      <p class="text-muted mb-4">
        Legale rappresentante: {{ cliente.get("NOME","") }} {{ cliente.get("COGNOME","") }}
      </p>

      <p class="text-muted small mb-3">
        Verrà generata la dichiarazione di conferma seriali MNP con la data di oggi.
      </p>

      <form method="post" action="/genera_dichiarazione">
        <input type="hidden" name="piva" value="{{ piva }}">
        <button type="submit" class="btn btn-danger w-100 btn-lg">
          Genera e scarica PDF
        </button>
      </form>

      <a href="/dichiarazione" class="btn btn-outline-secondary w-100 mt-2">← Nuova ricerca</a>
    </div>
  </div>
</body>
</html>
